# CertKeeper 客户端示例配置
# 部署到目标机器 /etc/certkeeper/client.yaml

server: "https://ck.example.com:3780"
token_id: "web01"
token_secret: "REPLACE_WITH_TOKEN_SECRET"
log_file: "/var/log/certkeeper.log"
log_level: "info"
# v2 apply 收到 HTTP 202 后会自动轮询 Location，直至任务终态。
# 当前 polling 间隔由客户端内置；生产环境不要使用 --v1 绕过失败。

defaults:
  out_dir: "/etc/nginx/certs"
  cert_file: "cert.pem"
  key_file: "key.pem"
  fullchain_file: "fullchain.pem"
  ca_file: "ca.pem"
  # nginx 校验命令
  verify_cmd: "nginx -t"
  # nginx reload 命令
  reload_cmd: "systemctl reload nginx"
