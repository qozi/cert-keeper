services:
  certkeeper:
    image: ghcr.io/qozi/certkeeper/certk-server:latest
    # 如需自行构建：取消下面两行注释
    # build:
    #   context: ..
    #   dockerfile: deploy/Dockerfile
    container_name: certkeeper
    restart: unless-stopped
    ports:
      # proxy TLS 示例：后端只发布到宿主机回环地址，由 nginx/Caddy 提供公网 HTTPS。
      - "127.0.0.1:3780:3780"
    volumes:
      - ./config.example.yaml:/data/config/config.yaml:ro
      - certkeeper-db:/data/db
      - certkeeper-acme:/data/acme
      - certkeeper-certs:/data/certs
      - certkeeper-backup:/data/backup
      - certkeeper-logs:/data/logs
    environment:
      # 加密主密钥必须显式提供，无默认值：请先在 deploy/.env 中设置
      # CK_ENCRYPTION_KEY（可用 certk-server --gen-encryption-key 生成）。
      # admin token 的 secret 由该密钥派生，同样不允许使用公开默认值。
      - CK_ENCRYPTION_KEY=${CK_ENCRYPTION_KEY:?必须在 .env 中设置 CK_ENCRYPTION_KEY（certk-server --gen-encryption-key 生成）}
      - TZ=Asia/Shanghai
    healthcheck:
      # proxy 模式下容器内仍使用 HTTP；公网 TLS 由反向代理终止。
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3780/readyz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  certkeeper-db:
  certkeeper-acme:
  certkeeper-certs:
  certkeeper-backup:
  certkeeper-logs:
