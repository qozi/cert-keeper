name: 发布

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: 已存在且指向当前提交的发布标签（例如 v1.2.3）
        required: true
        type: string

permissions:
  contents: read

env:
  GOTOOLCHAIN: auto
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  test:
    name: 发布测试门禁
    runs-on: ubuntu-24.04
    steps:
      - name: 检出代码
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: 配置 Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: 校验手动发布标签
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"
          [[ "$(git rev-list -n 1 "$RELEASE_TAG")" == "$GITHUB_SHA" ]]
      - name: 检查 gofmt
        shell: bash
        run: test -z "$(gofmt -l .)"
      - name: 运行 go vet
        run: go vet ./...
      - name: 运行全量测试
        run: go test ./...
      - name: 运行 Race 检测
        run: go test -race ./...
      - name: 单独运行端到端测试
        run: go test ./test/e2e
      - name: 安装固定版本 govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
      - name: 运行 govulncheck
        run: govulncheck ./...

  build:
    name: 构建发布产物
    needs: test
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - name: 检出代码
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: 配置 Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: 构建并生成校验和
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          output="certkeeper-${GOOS}-${GOARCH}"
          mkdir -p "$output"
          go build -trimpath -ldflags='-s -w' -o "$output/certk-server" ./cmd/server
          go build -trimpath -ldflags='-s -w' -o "$output/certk-server-cli" ./cmd/server-cli
          go build -trimpath -ldflags='-s -w' -o "$output/certk-client" ./cmd/client
          tar -czf "${output}.tar.gz" "$output"
          sha256sum "${output}.tar.gz" > "${output}.tar.gz.sha256"
      - name: 上传发布产物
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: certkeeper-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            certkeeper-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz
            certkeeper-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    name: 发布 GitHub Release
    needs:
      - test
      - build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: 下载发布产物
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: 发布
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes

  publish-images:
    name: 发布 ${{ matrix.target }} 容器镜像
    needs:
      - test
      - build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: server
            image: certk-server
          - target: client
            image: certk-client
    steps:
      - name: 检出代码
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: 配置 QEMU
        uses: docker/setup-qemu-action@68827325e0b33c7199eb31dd4e31fbe9023e06e3 # v3
      - name: 配置 Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: 登录 GHCR
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: 构建并发布固定版本镜像
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: deploy/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/qozi/certkeeper/${{ matrix.image }}:${{ env.RELEASE_TAG }}
          provenance: mode=max
          sbom: true
