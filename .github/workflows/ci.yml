name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache: true
      - run: go vet ./...
      - run: go test -race -coverprofile=cover.out ./...
      # v2 端到端测试（reconcile / generation / 原子部署 / 授权），单独执行便于定位
      - run: go test ./test/e2e
      - name: govulncheck
        # govulncheck 需联网安装并查询 Go 漏洞数据库；网络或漏洞库不可用时
        # 允许失败（continue-on-error），不阻断 CI，离线环境可整体注释掉本步骤
        continue-on-error: true
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - run: go build ./cmd/server && go build ./cmd/server-cli && go build ./cmd/client
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: cover.out
          if-no-files-found: ignore
