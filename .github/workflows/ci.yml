name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: auto

jobs:
  lint:
    name: 格式与静态检查
    runs-on: ubuntu-24.04
    steps:
      - name: 检出代码
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: 配置 Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: 检查 gofmt
        shell: bash
        run: |
          set -euo pipefail
          files="$(gofmt -l .)"
          if [[ -n "$files" ]]; then
            printf '以下文件未通过 gofmt：\n%s\n' "$files"
            exit 1
          fi
      - name: 运行 go vet
        run: go vet ./...
      - name: 检查 shell
        shell: bash
        run: git ls-files -z '*.sh' | xargs -0 -r shellcheck
      - name: 检查 YAML
        shell: bash
        run: |
          python3 -m pip install --disable-pip-version-check 'yamllint==1.37.1'
          git ls-files -z '*.yml' '*.yaml' | xargs -0 -r yamllint -d '{extends: relaxed, rules: {line-length: disable}}'
      - name: 检查 GitHub Actions workflow
        shell: bash
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.8
          actionlint

  test:
    name: 全量测试
    runs-on: ubuntu-24.04
    steps:
      - name: 检出代码
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: 配置 Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: 运行全量测试
        run: go test ./...
      - name: 单独运行端到端测试
        run: go test ./test/e2e

  race:
    name: Race 检测
    runs-on: ubuntu-24.04
    steps:
      - name: 检出代码
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: 配置 Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: 运行 Race 检测
        run: go test -race ./...

  build:
    name: 构建 ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - name: 检出代码
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: 配置 Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: 构建服务端和客户端
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          mkdir -p dist
          go build -trimpath -o "dist/certk-server-${GOOS}-${GOARCH}" ./cmd/server
          go build -trimpath -o "dist/certk-server-cli-${GOOS}-${GOARCH}" ./cmd/server-cli
          go build -trimpath -o "dist/certk-client-${GOOS}-${GOARCH}" ./cmd/client

  vulnerability:
    name: 漏洞扫描
    runs-on: ubuntu-24.04
    steps:
      - name: 检出代码
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: 配置 Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: 安装固定版本 govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
      - name: 运行 govulncheck
        run: govulncheck ./...

  docker-availability:
    name: 检测 Docker daemon
    runs-on: ubuntu-24.04
    outputs:
      available: ${{ steps.docker.outputs.available }}
    steps:
      - name: 检测 Docker daemon
        id: docker
        shell: bash
        run: |
          if command -v docker >/dev/null 2>&1 && docker info >/dev/null 2>&1; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo 'Docker daemon 不可用，Dockerfile/Compose smoke job 将明确跳过。' >> "$GITHUB_STEP_SUMMARY"
          fi

  docker-smoke:
    name: Dockerfile 与 Compose smoke
    needs: docker-availability
    if: needs.docker-availability.outputs.available == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: 检出代码
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: 校验 Compose
        env:
          CK_ENCRYPTION_KEY: ci-smoke-only-not-a-production-secret
        run: docker compose -f deploy/docker-compose.yml config --quiet
      - name: 构建 Dockerfile targets
        shell: bash
        run: |
          set -euo pipefail
          docker build --target server -f deploy/Dockerfile -t certkeeper/server:ci .
          docker build --target client -f deploy/Dockerfile -t certkeeper/client:ci .
